[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "devcleaner-cli"
dynamic = ["version"]
description = "Remove generated directories such as node_modules, .next, and dist from every project in a workspace."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Adones Balica", email = "adonesbalica@gmail.com" }]
keywords = [
    "cli",
    "cleanup",
    "developer-tools",
    "disk-space",
    "node-modules",
    "wsl",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
    "Topic :: System :: Filesystems",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/adonesbalica/dev-cleaner"
Repository = "https://github.com/adonesbalica/dev-cleaner"
Issues = "https://github.com/adonesbalica/dev-cleaner/issues"

[project.scripts]
dev-cleaner = "dev_cleaner.main:main"

[project.optional-dependencies]
dev = ["build>=1.2", "ruff>=0.17", "twine>=5"]

[tool.hatch.version]
path = "src/dev_cleaner/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/dev_cleaner"]

[tool.hatch.build.targets.sdist]
include = [
    "src/dev_cleaner",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
]
